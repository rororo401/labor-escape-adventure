<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이벤트 CG 재생산 검수 V2</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">GAMA STOCK · REGEN REVIEW</p>
      <h1>이벤트 CG 검수 V2</h1>
      <p id="summary" class="summary">목록을 불러오는 중…</p>
    </div>
    <div class="notice">판정만 저장돼. 게임 파일에는 자동 반영되지 않아.</div>
  </header>

  <main>
    <section class="stats" aria-label="검수 현황">
      <div><strong id="countTotal">0</strong><span>전체</span></div>
      <div><strong id="countPending">0</strong><span>미검수</span></div>
      <div><strong id="countApproved">0</strong><span>승인</span></div>
      <div><strong id="countEdit">0</strong><span>수정</span></div>
      <div><strong id="countRemake">0</strong><span>재생성</span></div>
    </section>

    <section class="filters" aria-label="목록 필터">
      <input id="searchInput" type="search" placeholder="이벤트명·경로·메모 검색">
      <select id="workstreamFilter"><option value="all">전체 작업군</option></select>
      <select id="groupFilter"><option value="all">전체 그룹</option></select>
      <select id="variantFilter"><option value="all">전체 계절</option></select>
      <select id="statusFilter">
        <option value="all">전체 판정</option>
        <option value="pending">미검수</option>
        <option value="approved">승인</option>
        <option value="needs_edit">수정 필요</option>
        <option value="remake">다시 만들기</option>
      </select>
      <select id="sortSelect">
        <option value="group">그룹순</option>
        <option value="status">판정순</option>
        <option value="path">경로순</option>
      </select>
    </section>

    <div class="list-info"><span id="visibleInfo">0장</span><span>카드를 누르면 크게 비교할 수 있어.</span></div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <nav class="pagination" aria-label="페이지 이동">
      <button id="previousPage" type="button">이전</button>
      <span id="pageInfo">0 / 0</span>
      <button id="nextPage" type="button">다음</button>
    </nav>
  </main>

  <dialog id="detailDialog">
    <div class="dialog-shell">
      <header class="dialog-header">
        <div>
          <div id="detailBadges" class="badges"></div>
          <h2 id="detailTitle"></h2>
          <p id="detailSummary"></p>
        </div>
        <button id="closeDetail" class="close" type="button" aria-label="상세 닫기">×</button>
      </header>
      <div class="compare">
        <figure><figcaption>기존 게임 이미지</figcaption><img id="oldImage" alt="기존 이미지"></figure>
        <figure><figcaption>신규 재생산 이미지</figcaption><img id="newImage" alt="신규 이미지"></figure>
      </div>
      <div class="detail-meta">
        <p><b>기존 경로</b><span id="oldPath"></span></p>
        <p><b>신규 경로</b><span id="newPath"></span></p>
        <p><b>생성 설계</b><span id="scenePlan"></span></p>
        <p><b>이전 판정</b><span id="previousDecision"></span></p>
      </div>
      <textarea id="noteInput" rows="3" placeholder="판정 메모"></textarea>
      <div class="decision-buttons">
        <button data-status="approved" type="button"><kbd>1</kbd> 승인</button>
        <button data-status="needs_edit" type="button"><kbd>2</kbd> 수정 필요</button>
        <button data-status="remake" type="button"><kbd>3</kbd> 다시 만들기</button>
        <button data-status="pending" type="button"><kbd>0</kbd> 미검수로</button>
      </div>
      <footer class="dialog-footer">
        <button id="previousItem" type="button">← 이전</button>
        <span id="detailPosition"></span>
        <button id="nextItem" type="button">다음 →</button>
      </footer>
    </div>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
